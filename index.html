<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="SkyShop — premium modern ecommerce storefront.">
  <title>SkyShop</title>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    window.__SKYSHOP_LOADER_FAILSAFE__ = setTimeout(function () {
      var el = document.getElementById("app-loader");
      if (el) el.classList.add("is-hidden");
    }, 8000);
  </script>
</head>
<body>
  <div id="app-loader" class="app-loader" aria-label="Loading SkyShop">
    <div class="loader-orbit"><span></span><span></span><span></span></div>
    <div class="loader-brand">Sky<span>Shop</span></div>
    <div class="loader-progress"><i></i></div>
    <p>Preparing your shopping experience</p>
  </div>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
